name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Check Linux packaging script syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/pack.sh

  build:
    name: Build XPI
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build XPI
        shell: pwsh
        run: .\scripts\pack.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  website:
    name: Website
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Check website types and translations
        run: npm run check

      - name: Build website
        run: npm run build
