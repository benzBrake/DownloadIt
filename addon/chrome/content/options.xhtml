<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://downloadit/content/options.css" type="text/css"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="localization" href="downloadit.ftl" />
    <title>DownloadIt</title>
    <script type="application/javascript" src="chrome://downloadit/content/options.js"></script>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand-lockup">
          <img id="developer-mode-trigger" class="brand-mark" src="chrome://downloadit/content/icons/downloadit.svg" alt="" aria-hidden="true" draggable="false" />
          <div>
            <div class="brand-name">DownloadIt</div>
            <div class="brand-subtitle" data-l10n-id="downloadit-brand-subtitle"></div>
          </div>
        </div>

        <nav class="section-nav" data-l10n-id="downloadit-nav" data-l10n-attrs="aria-label">
          <button class="nav-item is-active" type="button" role="tab" aria-selected="true" aria-controls="section-managers" data-section="managers">
            <span class="nav-number">01</span>
            <span data-l10n-id="downloadit-nav-managers"></span>
          </button>
          <button class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="section-auto-capture" data-section="auto-capture">
            <span class="nav-number">02</span>
            <span data-l10n-id="downloadit-nav-auto-capture"></span>
          </button>
          <button class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="section-link-groups" data-section="link-groups">
            <span class="nav-number">03</span>
            <span data-l10n-id="downloadit-nav-link-groups"></span>
          </button>
          <button class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="section-mirrors" data-section="mirrors" hidden="hidden">
            <span class="nav-number">04</span>
            <span data-l10n-id="downloadit-nav-mirrors"></span>
          </button>
          <button class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="section-privacy" data-section="privacy">
            <span class="nav-number">04</span>
            <span data-l10n-id="downloadit-nav-privacy"></span>
          </button>
          <button class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="section-about" data-section="about">
            <span class="nav-number">05</span>
            <span data-l10n-id="downloadit-nav-about"></span>
          </button>
        </nav>

        <div class="sidebar-status">
          <span id="sidebar-status-dot" class="status-dot is-pending" aria-hidden="true"></span>
          <span id="sidebar-status" data-l10n-id="downloadit-service-starting"></span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="content-header">
          <div id="section-kicker" class="section-kicker" data-l10n-id="downloadit-manager-kicker"></div>
          <h1 id="section-title" data-l10n-id="downloadit-manager-title"></h1>
          <p id="section-description" data-l10n-id="downloadit-manager-description"></p>
        </header>

        <div class="content-scroll">
          <section id="section-managers" class="settings-section" role="tabpanel" aria-labelledby="section-title" data-section-panel="managers">
            <div class="status-strip">
              <div>
                <div id="manager-count" class="status-strip-value">0</div>
                <div id="manager-count-label" class="status-strip-label" data-l10n-id="downloadit-manager-count-label"></div>
              </div>
              <div id="manager-state" class="status-strip-state" role="status" data-l10n-id="downloadit-detection-idle"></div>
            </div>

            <div class="setting-group">
              <div class="group-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-default-manager-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-default-manager-title"></h2>
                </div>
                <span id="default-manager-lock" class="lock-note" hidden="hidden" data-l10n-id="downloadit-locked"></span>
              </div>
              <label class="select-label" for="default-manager" data-l10n-id="downloadit-default-manager-label"></label>
              <div class="select-row">
                <xul:menulist id="default-manager" aria-describedby="default-manager-help">
                  <xul:menupopup id="default-manager-popup" />
                </xul:menulist>
                <button id="refresh-managers" class="secondary-button" type="button">
                  <span class="button-glyph" aria-hidden="true">&#x21bb;</span>
                  <span data-l10n-id="downloadit-refresh-managers"></span>
                </button>
              </div>
              <p id="default-manager-help" class="field-help" data-l10n-id="downloadit-default-manager-help"></p>
            </div>

            <div class="setting-group">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-task-start-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-task-start-title"></h2>
                </div>
                <span id="auto-start-tasks-lock" class="lock-note" hidden="hidden" data-l10n-id="downloadit-locked"></span>
              </div>
              <label class="toggle-row" for="auto-start-tasks">
                <input id="auto-start-tasks" type="checkbox" />
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                <span class="toggle-copy">
                  <strong data-l10n-id="downloadit-auto-start-tasks-title"></strong>
                  <small data-l10n-id="downloadit-auto-start-tasks-help"></small>
                </span>
              </label>
            </div>

            <div class="setting-group manager-group">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-available-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-available-title"></h2>
                </div>
                <div class="group-actions">
                  <button id="reload-custom-downloaders" class="icon-button" type="button" data-l10n-id="downloadit-reload-custom-downloaders" data-l10n-attrs="title,aria-label">&#x21bb;</button>
                  <button id="add-download-tool" class="secondary-button" type="button">
                    <span class="button-glyph" aria-hidden="true">+</span>
                    <span data-l10n-id="downloadit-add-download-tool"></span>
                  </button>
                </div>
              </div>
              <div id="custom-config-error" class="inline-note is-warning" hidden="hidden">
                <span class="note-mark" aria-hidden="true">!</span>
                <span id="custom-config-error-message"></span>
                <span class="inline-note-actions">
                  <button id="retry-custom-downloaders" class="text-button" type="button" data-l10n-id="downloadit-retry-custom-downloaders"></button>
                  <button id="reset-custom-downloaders" class="text-button" type="button" data-l10n-id="downloadit-reset-custom-downloaders"></button>
                </span>
              </div>
              <ul id="manager-list" class="manager-list"></ul>
            </div>
          </section>

          <section id="section-auto-capture" class="settings-section" role="tabpanel" aria-labelledby="section-title" data-section-panel="auto-capture" hidden="hidden">
            <div id="auto-capture-config-error" class="inline-note is-warning" role="alert" hidden="hidden">
              <span class="note-mark" aria-hidden="true">!</span>
              <span id="auto-capture-config-error-message"></span>
              <span class="inline-note-actions">
                <button id="retry-auto-capture-rules" class="text-button" type="button" data-l10n-id="downloadit-retry-auto-capture"></button>
                <button id="reset-auto-capture-rules" class="text-button" type="button" data-l10n-id="downloadit-reset-auto-capture"></button>
              </span>
            </div>
            <p class="auto-rule-policy" data-l10n-id="downloadit-auto-rules-help"></p>

            <div class="auto-capture-grid">
              <div class="setting-group auto-rule-group">
                <div class="group-heading compact-heading">
                  <div>
                    <div class="eyebrow" data-l10n-id="downloadit-auto-allow-eyebrow"></div>
                    <h3 data-l10n-id="downloadit-auto-allow-title"></h3>
                  </div>
                </div>
                <p class="field-help" data-l10n-id="downloadit-auto-allow-help"></p>
                <div class="auto-rule-entry">
                  <input id="auto-allow-input" type="text" spellcheck="false" data-l10n-id="downloadit-auto-rule-input" data-l10n-attrs="placeholder,aria-label" />
                  <button id="add-auto-allow" class="secondary-button" type="button" data-l10n-id="downloadit-add-auto-allow"></button>
                </div>
                <ul id="auto-allow-list" class="manager-list auto-extension-list"></ul>
                <div class="auto-rule-footer">
                  <button id="clear-auto-allow" class="text-button" type="button" data-l10n-id="downloadit-clear-auto-allow"></button>
                </div>
              </div>

              <div class="setting-group auto-rule-group">
                <div class="group-heading compact-heading">
                  <div>
                    <div class="eyebrow" data-l10n-id="downloadit-auto-deny-eyebrow"></div>
                    <h3 data-l10n-id="downloadit-auto-deny-title"></h3>
                  </div>
                </div>
                <p class="field-help" data-l10n-id="downloadit-auto-deny-help"></p>
                <div class="auto-rule-entry">
                  <input id="auto-deny-input" type="text" spellcheck="false" data-l10n-id="downloadit-auto-rule-input" data-l10n-attrs="placeholder,aria-label" />
                  <button id="add-auto-deny" class="secondary-button" type="button" data-l10n-id="downloadit-add-auto-deny"></button>
                </div>
                <ul id="auto-deny-list" class="manager-list auto-extension-list"></ul>
                <div class="auto-rule-footer">
                  <button id="clear-auto-deny" class="text-button" type="button" data-l10n-id="downloadit-clear-auto-deny"></button>
                </div>
              </div>
            </div>
          </section>

          <section id="section-link-groups" class="settings-section" role="tabpanel" aria-labelledby="section-title" data-section-panel="link-groups" hidden="hidden">
            <div class="status-strip">
              <div>
                <div id="link-group-count" class="status-strip-value">0</div>
                <div class="status-strip-label" data-l10n-id="downloadit-link-group-count-label"></div>
              </div>
              <div id="custom-link-group-count" class="status-strip-state"></div>
            </div>

            <div class="setting-group link-group-section">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-built-in-link-groups-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-built-in-link-groups-title"></h2>
                </div>
                <span id="link-group-lock" class="lock-note" hidden="hidden" data-l10n-id="downloadit-locked"></span>
              </div>
              <p class="field-help group-intro" data-l10n-id="downloadit-built-in-link-groups-help"></p>
              <ul id="built-in-link-group-list" class="link-group-list"></ul>
            </div>

            <div class="setting-group link-group-section">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-custom-link-groups-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-custom-link-groups-title"></h2>
                </div>
                <button id="add-custom-link-group" class="secondary-button" type="button">
                  <span class="button-glyph" aria-hidden="true">+</span>
                  <span data-l10n-id="downloadit-add-custom-link-group"></span>
                </button>
              </div>
              <p class="field-help group-intro" data-l10n-id="downloadit-custom-link-groups-help"></p>
              <ul id="custom-link-group-list" class="link-group-list"></ul>
            </div>
          </section>

          <section id="section-mirrors" class="settings-section" role="tabpanel" aria-labelledby="section-title" data-section-panel="mirrors" hidden="hidden">
            <div class="setting-group mirror-group">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-mirror-adapters-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-mirror-adapters-title"></h2>
                </div>
                <span id="mirror-settings-lock" class="lock-note" hidden="hidden" data-l10n-id="downloadit-locked"></span>
              </div>
              <p id="mirror-endpoint-help" class="field-help group-intro" data-l10n-id="downloadit-mirror-adapters-help"></p>
              <div id="mirror-adapter-list" class="mirror-adapter-list"></div>
              <div id="mirror-validation" class="inline-note is-warning" role="alert" hidden="hidden">
                <span class="note-mark" aria-hidden="true">!</span>
                <span id="mirror-validation-message"></span>
              </div>
            </div>

            <div class="inline-note mirror-cookie-note">
              <span class="note-mark" aria-hidden="true">i</span>
              <span data-l10n-id="downloadit-mirror-cookie-policy"></span>
            </div>
          </section>

          <section id="section-privacy" class="settings-section" role="tabpanel" aria-labelledby="section-title" data-section-panel="privacy" hidden="hidden">
            <div class="setting-group">
              <div class="group-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-privacy-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-privacy-title"></h2>
                </div>
              </div>

              <label class="toggle-row" for="send-cookies">
                <input id="send-cookies" type="checkbox" />
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                <span class="toggle-copy">
                  <strong data-l10n-id="downloadit-send-cookies-title"></strong>
                  <small data-l10n-id="downloadit-send-cookies-help"></small>
                </span>
              </label>
              <div id="cookie-lock" class="inline-note is-warning" hidden="hidden">
                <span class="note-mark" aria-hidden="true">!</span>
                <span data-l10n-id="downloadit-cookie-locked"></span>
              </div>
            </div>

            <div class="setting-group">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-idm-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-idm-title"></h2>
                </div>
              </div>
              <label class="toggle-row" for="idm-bridge">
                <input id="idm-bridge" type="checkbox" aria-describedby="idm-bridge-help" />
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                <span class="toggle-copy">
                  <strong data-l10n-id="downloadit-idm-bridge-title"></strong>
                </span>
              </label>
              <p id="idm-bridge-help" class="field-help toggle-help" data-l10n-id="downloadit-idm-bridge-help">
                <a
                  data-l10n-name="linkswift"
                  href="https://github.com/hmjz100/LinkSwift"
                  target="_blank"
                  rel="noopener noreferrer"
                ></a>
              </p>
              <div id="idm-bridge-lock" class="inline-note is-warning" hidden="hidden">
                <span class="note-mark" aria-hidden="true">!</span>
                <span data-l10n-id="downloadit-idm-bridge-locked"></span>
              </div>
            </div>

            <div class="setting-group">
              <div class="group-heading compact-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-automatic-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-automatic-title"></h2>
                </div>
              </div>
              <div class="info-list">
                <div class="info-row">
                  <span class="info-mark is-on" aria-hidden="true"></span>
                  <div>
                    <strong data-l10n-id="downloadit-referer-title"></strong>
                    <span data-l10n-id="downloadit-automatic-label"></span>
                  </div>
                </div>
                <div class="info-row">
                  <span class="info-mark is-on" aria-hidden="true"></span>
                  <div>
                    <strong data-l10n-id="downloadit-user-agent-title"></strong>
                    <span data-l10n-id="downloadit-automatic-label"></span>
                  </div>
                </div>
              </div>
              <p class="field-help" data-l10n-id="downloadit-automatic-help"></p>
            </div>
          </section>

          <section id="section-about" class="settings-section" role="tabpanel" aria-labelledby="section-title" data-section-panel="about" hidden="hidden">
            <div class="setting-group">
              <div class="group-heading">
                <div>
                  <div class="eyebrow" data-l10n-id="downloadit-about-eyebrow"></div>
                  <h2 data-l10n-id="downloadit-about-title"></h2>
                </div>
              </div>
              <dl class="diagnostic-list">
                <div class="diagnostic-row">
                  <dt data-l10n-id="downloadit-version-label"></dt>
                  <dd id="addon-version">--</dd>
                </div>
                <div class="diagnostic-row">
                  <dt data-l10n-id="downloadit-platform-label"></dt>
                  <dd id="platform-status" data-l10n-id="downloadit-windows"></dd>
                </div>
                <div class="diagnostic-row">
                  <dt data-l10n-id="downloadit-service-label"></dt>
                  <dd id="service-status" data-l10n-id="downloadit-unavailable"></dd>
                </div>
                <div class="diagnostic-row diagnostic-path">
                  <dt data-l10n-id="downloadit-binary-label"></dt>
                  <dd id="binary-path">--</dd>
                </div>
              </dl>
            </div>

            <div class="diagnostic-callout">
              <span class="callout-mark" aria-hidden="true">DI</span>
              <div>
                <strong data-l10n-id="downloadit-about-callout-title"></strong>
                <p data-l10n-id="downloadit-about-callout-help"></p>
              </div>
            </div>
          </section>
        </div>

        <footer class="action-bar">
          <div id="change-state" class="change-state" role="status" data-l10n-id="downloadit-no-changes"></div>
          <div class="action-buttons">
            <button id="cancel" class="text-button" type="button" data-l10n-id="downloadit-cancel"></button>
            <button id="apply" class="primary-button" type="button" disabled="disabled" data-l10n-id="downloadit-apply"></button>
          </div>
        </footer>
      </main>
    </div>

    <div id="download-tool-editor" class="editor-backdrop" hidden="hidden">
      <section class="editor-dialog tool-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="tool-editor-title">
        <header class="editor-header">
          <div>
            <div class="eyebrow" data-l10n-id="downloadit-tool-editor-eyebrow"></div>
            <h2 id="tool-editor-title" data-l10n-id="downloadit-tool-editor-add-title"></h2>
          </div>
          <button id="tool-editor-close" class="icon-button" type="button" data-l10n-id="downloadit-tool-editor-close" data-l10n-attrs="title,aria-label">&#xd7;</button>
        </header>

        <div class="editor-kind-tabs" role="tablist" data-l10n-id="downloadit-tool-kind-tabs" data-l10n-attrs="aria-label">
          <button id="tool-kind-builtin" class="editor-kind-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="tool-editor-builtin" data-tool-kind="builtin" data-l10n-id="downloadit-tool-kind-builtin"></button>
          <button id="tool-kind-custom" class="editor-kind-tab" type="button" role="tab" aria-selected="false" aria-controls="tool-editor-custom" data-tool-kind="custom" data-l10n-id="downloadit-tool-kind-custom"></button>
        </div>

        <div class="editor-scroll">
          <section id="tool-editor-builtin" class="tool-editor-panel" role="tabpanel" aria-labelledby="tool-kind-builtin">
            <div class="editor-field protocol-picker">
              <label for="built-in-protocol" data-l10n-id="downloadit-built-in-protocol-label"></label>
              <select id="built-in-protocol"></select>
            </div>

            <div data-built-in-protocol-fields="jdownloader">
              <div class="protocol-status-line">
                <span id="jdownloader-status-dot" class="manager-dot is-error" aria-hidden="true"></span>
                <span class="protocol-status-copy">
                  <strong>JDownloader</strong>
                  <span id="jdownloader-status" data-l10n-id="downloadit-jdownloader-status-unavailable"></span>
                </span>
                <span id="jdownloader-lock" class="lock-note" hidden="hidden" data-l10n-id="downloadit-locked"></span>
              </div>

              <label class="toggle-row compact-toggle" for="jdownloader-auto-launch">
                <input id="jdownloader-auto-launch" type="checkbox" />
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                <span class="toggle-copy">
                  <strong data-l10n-id="downloadit-jdownloader-auto-launch-title"></strong>
                  <small data-l10n-id="downloadit-jdownloader-auto-launch-help"></small>
                </span>
              </label>

              <div class="editor-field">
                <label for="jdownloader-launch-path" data-l10n-id="downloadit-jdownloader-path-label"></label>
                <div class="input-action-row">
                  <input id="jdownloader-launch-path" type="text" readonly="readonly" />
                  <button id="browse-jdownloader-path" class="secondary-button path-action-button" type="button" data-l10n-id="downloadit-browse"></button>
                  <button id="clear-jdownloader-path" class="secondary-button path-action-button" type="button" data-l10n-id="downloadit-clear"></button>
                </div>
                <p id="jdownloader-detected-path" class="field-help"></p>
              </div>

              <details class="advanced-settings">
                <summary data-l10n-id="downloadit-advanced-settings"></summary>
                <div class="advanced-settings-body">
                  <div class="editor-field">
                    <label for="jdownloader-endpoint" data-l10n-id="downloadit-jdownloader-endpoint-label"></label>
                    <input id="jdownloader-endpoint" type="url" spellcheck="false" />
                    <p class="field-help" data-l10n-id="downloadit-jdownloader-endpoint-help"></p>
                  </div>
                </div>
              </details>

              <div class="connection-row">
                <button id="test-jdownloader" class="secondary-button" type="button" data-l10n-id="downloadit-jdownloader-test"></button>
                <span id="jdownloader-test-state" role="status"></span>
              </div>
            </div>

            <div data-built-in-protocol-fields="abdm">
              <div class="protocol-status-line">
                <span id="abdm-status-dot" class="manager-dot is-error" aria-hidden="true"></span>
                <span class="protocol-status-copy">
                  <strong data-l10n-id="downloadit-abdm-title"></strong>
                  <span id="abdm-status" data-l10n-id="downloadit-abdm-status-unavailable"></span>
                </span>
                <span id="abdm-lock" class="lock-note" hidden="hidden" data-l10n-id="downloadit-locked"></span>
              </div>

              <label class="toggle-row compact-toggle" for="abdm-enabled">
                <input id="abdm-enabled" type="checkbox" />
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                <span class="toggle-copy">
                  <strong data-l10n-id="downloadit-abdm-enabled-title"></strong>
                  <small data-l10n-id="downloadit-abdm-enabled-help"></small>
                </span>
              </label>

              <div class="editor-field">
                <label for="abdm-launch-path" data-l10n-id="downloadit-abdm-path-label"></label>
                <div class="input-action-row">
                  <input id="abdm-launch-path" type="text" readonly="readonly" />
                  <button id="browse-abdm-path" class="secondary-button" type="button" data-l10n-id="downloadit-browse"></button>
                  <button id="edit-abdm-path" class="icon-button" type="button" data-l10n-id="downloadit-edit-abdm-path" data-l10n-attrs="title,aria-label">&#x270e;</button>
                  <button id="clear-abdm-path" class="text-button" type="button" data-l10n-id="downloadit-clear"></button>
                </div>
                <p class="field-help" data-l10n-id="downloadit-abdm-path-help"></p>
